<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbf8">
  <meta name="description" content="Bingo，一款原生、快速、可配置的 Android AI 聊天客户端。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Bingo">
  <meta property="og:title" content="Bingo for Android">
  <meta property="og:description" content="Find your way. With Bingo.">
  <meta property="og:image" content="https://less55093-collab.github.io/bingo/assets/chat.png">
  <title>Bingo</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="./" aria-label="Bingo 首页">
      <img src="./assets/bingo-mark.png" alt="" width="78" height="96">
      <span>ingo</span>
    </a>

    <a
      class="release-link"
      href="https://github.com/less55093-collab/bingo/releases/tag/v1.0.2"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="在 GitHub 查看 Bingo 1.0.2"
    >
      <span class="release-status" aria-hidden="true"></span>
      <span class="release-source">GitHub</span>
      <span class="release-separator" aria-hidden="true">·</span>
      <span>v1.0.2</span>
      <span class="outward" aria-hidden="true">↗</span>
    </a>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-content">
        <h1 id="hero-title">
          <span class="headline-line headline-line-one">Find your way.</span>
          <span class="headline-line headline-line-two">With <span class="bingo-accent">Bingo.</span></span>
        </h1>

        <p class="tagline">A thoughtful AI companion for the moments when you<br class="desktop-break"> need to think out loud.</p>

        <div class="download-actions">
          <a
            class="download-button"
            href="https://github.com/less55093-collab/bingo/releases/latest/download/app-arm64-v8a-release.apk"
            aria-label="下载适用于 Android arm64 设备的 Bingo 最新版本"
          >
            <span class="download-title">下载 Bingo</span>
            <span class="download-meta">Android · arm64</span>
          </a>
          <a class="all-builds" href="https://github.com/less55093-collab/bingo/releases/latest">查看其他安装包</a>
        </div>
      </div>

      <div class="artifact-line" aria-label="Bingo 最新版本">
        <span class="live-label"><span class="live-dot" aria-hidden="true"></span>READY</span>
        <span class="rule" aria-hidden="true"></span>
        <a href="https://github.com/less55093-collab/bingo/releases/latest">LATEST RELEASE <span aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="app-previews" aria-label="Bingo 应用预览">
      <figure class="preview preview-chat">
        <img src="./assets/chat.png" alt="Bingo 聊天界面" width="990" height="2048">
      </figure>
      <figure class="preview preview-assistants">
        <img src="./assets/assistants.png" alt="Bingo 助手设置界面" width="990" height="2048">
      </figure>
      <figure class="preview preview-providers">
        <img src="./assets/providers.png" alt="Bingo 模型服务商设置界面" width="990" height="2048">
      </figure>
    </section>
  </main>
</body>
</html>
